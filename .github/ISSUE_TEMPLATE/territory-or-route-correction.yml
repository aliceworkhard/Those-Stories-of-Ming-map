name: 🗺️ 疆域边界 / 古今地名 / 行军路线考据指正
description: 发现某年份政权边界、古黄河水系、古今地名坐标或战役行军路线与史实有出入？欢迎考据指正！
title: "[Cartography]: "
labels: ["cartography", "historical-accuracy"]
body:
  - type: input
    id: target_scope
    attributes:
      label: 涉及的年份切片、战役或地点名称
      placeholder: 例如：1621年辽东边界 / 萨尔浒之战杜松路行军线 / 大宁都司坐标
    validations:
      required: true
  - type: textarea
    id: discrepancy
    attributes:
      label: 当前图上表现 vs 历史考据事实
      placeholder: 请说明当前地图中哪一处边界或路线不准确，以及应当如何修正...
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 参考史料或历史地图集依据
      placeholder: 例如：《中国历史地图集》第七册（元·明时期）第XX页、《明实录》、《读史方舆纪要》等
