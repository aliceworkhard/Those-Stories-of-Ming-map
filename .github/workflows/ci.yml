name: CI — Validate Data, Typecheck, Regression Tests & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate historical dataset schemas & copyright compliance
        run: npm run validate:data

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Engine & local-delta geometry regression tests
        run: npm test

      - name: Production build (Vercel / Static)
        run: npm run build

      - name: Verify Docker standalone server output
        env:
          DOCKER_STANDALONE: '1'
        run: npm run build
